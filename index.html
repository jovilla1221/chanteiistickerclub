<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Our Mensiversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=VT323&family=Caveat:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Title bar -->
<div class="title-strip">
  <span class="os-title">OUR MENSIVERSARY 💕</span>
</div>

<!-- OS container -->
<div class="desktop" id="desktop">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-icon" data-app="mail" title="Messages"><i class="fas fa-envelope"></i><span class="cat-dot" data-img="sidebar-1">🐱</span></div>
    <div class="sidebar-icon" data-app="files" title="Archive"><i class="fas fa-folder"></i><span class="cat-dot" data-img="sidebar-2">🐱</span></div>
    <div class="sidebar-icon" data-app="save" title="Keepsake"><i class="fas fa-floppy-disk"></i><span class="cat-dot" data-img="sidebar-3">🐱</span></div>
    <div class="sidebar-icon" data-app="cats" title="OURS.exe"><i class="fas fa-paw"></i><span class="cat-dot" data-img="sidebar-4">🐱</span></div>
    <div class="sidebar-icon" data-app="draw" title="Memories.so"><i class="fas fa-paintbrush"></i><span class="cat-dot" data-img="sidebar-5">🐱</span></div>
    <div class="sidebar-icon" data-app="web" title="Connect"><i class="fas fa-globe"></i><span class="cat-dot" data-img="sidebar-6">🐱</span></div>
    <div class="sidebar-icon" data-app="trash" title="Let Go"><i class="fas fa-trash"></i><span class="cat-dot" data-img="sidebar-7">🐱</span></div>
    <div class="sidebar-icon" data-app="notes" title="Diary"><i class="fas fa-pencil"></i><span class="cat-dot" data-img="sidebar-8">🐱</span></div>
    <div class="sidebar-icon" data-app="letters" title="Letters"><i class="fas fa-envelope-open"></i><span class="cat-dot" data-img="sidebar-9">🐱</span></div>
    <div class="sidebar-icon" data-app="music" title="Music"><i class="fas fa-music"></i><span class="cat-dot" data-img="sidebar-10">🐱</span></div>
  </aside>
  <main class="content" id="content">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-spacer">💕</div>
      <h1>Happy Mensiversary</h1>
      <p>klik ikon / tab buka app. drag window. susun ulang. nikmati 💕</p>
    </div>
  </main>
</div>

<!-- Mobile Tab Bar (above dock layer) -->
<div class="mobile-tabs" id="mobileTabs">
  <button class="mobile-tab" data-app="mail" title="Messages"><i class="fas fa-envelope"></i></button>
  <button class="mobile-tab" data-app="files" title="Archive"><i class="fas fa-folder"></i></button>
  <button class="mobile-tab" data-app="save" title="Keepsake"><i class="fas fa-floppy-disk"></i></button>
  <button class="mobile-tab" data-app="cats" title="OURS.exe"><i class="fas fa-paw"></i></button>
  <button class="mobile-tab" data-app="draw" title="Memories.so"><i class="fas fa-paintbrush"></i></button>
  <button class="mobile-tab" data-app="web" title="Connect"><i class="fas fa-globe"></i></button>
  <button class="mobile-tab" data-app="trash" title="Let Go"><i class="fas fa-trash"></i></button>
  <button class="mobile-tab" data-app="notes" title="Diary"><i class="fas fa-pencil"></i></button>
  <button class="mobile-tab" data-app="letters" title="Letters"><i class="fas fa-envelope-open"></i></button>
  <button class="mobile-tab" data-app="music" title="Music"><i class="fas fa-music"></i></button>
</div>

<!-- Desktop dock -->
<div class="dock" id="dock">
  <div class="dock-item" data-app="sunny"><i class="fas fa-sun"></i><span>VIBES</span></div>
  <div class="dock-item" data-app="time"><i class="fas fa-clock"></i><span id="dockTime">--:--</span></div>
  <div class="dock-item" data-app="chanteii">
    <span class="dock-avatar" data-img="dock-avatar">💖</span>
    <span>FOR YOU</span>
  </div>
</div>

<!-- Mobile overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<script>
fetch('config.json')
  .then(r => r.json())
  .then(cfg => {
    const imgs = cfg.images || {};
    document.querySelectorAll('[data-img]').forEach(el => {
      const key = el.getAttribute('data-img');
      const src = imgs[key];
      if (src) {
        el.innerHTML = '<img src="' + src + '" width="18" height="18" style="border-radius:50%;object-fit:cover;display:block" onerror="this.style.display=\'none\'">';
        el.style.background = 'none';
        el.style.padding = '0';
      }
    });
    const dockAv = document.querySelector('.dock-avatar');
    if (dockAv && imgs['dock-avatar']) {
      dockAv.innerHTML = '<img src="' + imgs['dock-avatar'] + '" width="24" height="24" style="border-radius:50%;object-fit:cover;display:block" onerror="this.style.display=\'none\'">';
    }
    window.__imgCfg = cfg;
  });
</script>
<script src="app.js"></script>
</body>
</html>
